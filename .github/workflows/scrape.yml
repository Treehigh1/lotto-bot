name: Scrape Lottery Results

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 11 * * 2'
    - cron: '30 11 * * 4'
    - cron: '30 11 * * 6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python lottery_v2.py

      - name: Commit and push results
        run: |
          git config user.name "Number Oracle Bot"
          git config user.email "bot@numberoracle.online"
          git add results.json
          if git diff --cached --quiet; then
            echo "No new data to commit — results already up to date"
          else
            DRAWS=$(python -c "import json; d=json.load(open('results.json')); total=sum(len(v) for v in d.values()); print(total)")
            git commit -m "Update results — $DRAWS total draws [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "Pushed new results — $DRAWS total draws"
          fi
